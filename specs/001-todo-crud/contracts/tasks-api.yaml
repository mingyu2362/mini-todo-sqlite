openapi: 3.0.3
info:
  title: Todo (Tasks) API
  version: "1.0.0"
  description: >
    할 일 추가/조회/토글/삭제를 위한 REST API. 모든 응답은 성공 시
    `{ "data": ... }`, 실패 시 `{ "error": { "message": string } }` 형태를
    따른다 (헌법 원칙 II: Unified JSON API Responses).
paths:
  /api/tasks:
    get:
      summary: 할 일 목록 조회 (User Story 2, FR-004)
      responses:
        "200":
          description: 전체 할 일 목록 (생성 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Todo"
    post:
      summary: 할 일 추가 (User Story 1, FR-001/FR-002/FR-003/FR-011)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "201":
          description: 생성된 할 일 (completed = false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Todo"
        "400":
          description: 제목이 비어 있거나 공백만 있거나 200자를 초과함 (FR-002, FR-011)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tasks/{id}:
    patch:
      summary: 완료 여부 토글 (User Story 3, FR-005)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 토글 후의 할 일 (completed 반전)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Todo"
        "404":
          description: 존재하지 않거나 이미 삭제된 id (FR-007)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 할 일 삭제 (User Story 4, FR-006)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제된 할 일의 id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        "404":
          description: 존재하지 않거나 이미 삭제된 id (FR-007)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Todo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
